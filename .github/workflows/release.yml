name: Manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag to release, for example v1.0.0
        required: true
        type: string
      publish:
        description: Confirm that this workflow may create a GitHub draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: latest
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - name: Verify release
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go test -tags integration ./...
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --generate-notes
