name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release (for example v1.0.0)
        required: true
        type: string
      publish:
        description: Confirm that this workflow may create a draft GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must follow semantic versioning, such as v1.0.0" >&2
            exit 1
          fi
          if [ "$(git describe --tags --exact-match HEAD)" != "$RELEASE_TAG" ]; then
            echo "Checked out commit does not match the requested tag" >&2
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: latest
      - name: Verify release
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go test -tags=integration ./...
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --draft --generate-notes
